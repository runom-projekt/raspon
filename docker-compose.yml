services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: raspon
      POSTGRES_PASSWORD: raspon
      POSTGRES_DB: raspon
    ports:
      - "5432:5432"
    volumes:
      - raspon_postgres_data:/var/lib/postgresql/data

volumes:
  raspon_postgres_data:
